<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 3 — Meet FESTIVALMINT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      background: #0c121e;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glow-aura {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(5, 150, 105, 0.05) 50%, transparent 70%);
      filter: blur(80px);
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(12, 18, 30, 0.8));
      border: 1px solid rgba(52, 211, 153, 0.4);
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.35);
      margin-bottom: 32px;
      opacity: 0;
      transform: scale(0.8);
      animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .logo-container svg {
      width: 64px;
      height: 64px;
      color: #34d399;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #a7f3d0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.4s forwards;
    }
    h1 {
      font-size: 80px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }
    .brand-ai {
      color: #10b981;
      text-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
    }
    p.tagline {
      font-size: 28px;
      color: #cbd5e1;
      font-weight: 500;
      max-width: 800px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }

    @keyframes zoomIn {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow-aura"></div>
  <div class="content">
    <div class="logo-container">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4.5 7.5A2.5 2.5 0 0 1 7 5h10a2.5 2.5 0 0 1 2.5 2.5v2a2 2 0 1 0 0 4v3A2.5 2.5 0 0 1 17 19H7a2.5 2.5 0 0 1-2.5-2.5v-3a2 2 0 1 0 0-4v-2Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
        <path d="M12 8.25 13.1 10.9 15.75 12 13.1 13.1 12 15.75 10.9 13.1 8.25 12 10.9 10.9 12 8.25Z" fill="#10B981"/>
      </svg>
    </div>
    <div>
      <div class="pill">Meet The Solution</div>
    </div>
    <h1>FESTIVALMINT <span class="brand-ai">AI</span></h1>
    <p class="tagline">The intelligent university sponsorship marketplace connecting verified campus events with forward-thinking brand partners.</p>
  </div>
</body>
</html>
